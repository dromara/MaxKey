<nz-card nzTitle="Passkey 管理">
  <div nz-row [nzGutter]="24">
    <div nz-col [nzSpan]="24">
      <div class="mb-md">
        <p class="text-grey">Passkey 是一种更安全、更便捷的登录方式，使用您的设备生物识别或 PIN 码进行身份验证。</p>
      </div>

      <div class="mb-lg">
        <button nz-button nzType="primary" nzSize="large" [nzLoading]="loading" (click)="registerPasskey()">
          <nz-icon nzType="plus-circle" nzTheme="outline" />
          注册新的 Passkey
        </button>
      </div>
    </div>
  </div>

  <nz-table
    #dynamicTable
    [nzData]="passkeyList"
    [nzShowPagination]="false"
    nzTableLayout="auto"
    nzSize="small"
    nzShowSizeChanger
    [nzBordered]="true"
  >
    <thead>
      <tr>
        <th nzAlign="center">凭证信息</th>
        <th nzAlign="center">签名统计</th>
        <th nzAlign="center" class="table-column-datetime">创建时间</th>
        <th nzAlign="center" class="table-column-datetime">最近访问时间</th>
        <th nzAlign="center" class="table-action-column-2">操作</th>
      </tr>
    </thead>
    <tbody>
      @for (data of passkeyList; track data) {
        <tr>
          <td>{{ data.deviceType === 'platform' ? '平台认证器' : '跨平台认证器' }}[{{ data.credentialId || data.id }}]</td>
          <td nzAlign="center">{{ data.signatureCount || 0 }}</td>
          <td>{{ data.createdDate }}</td>
          <td>{{ data.lastUsedDate }}</td>
          <td>
            <button nz-button nzType="link" nzDanger nzSize="small" (click)="confirmDeletePasskey(data.credentialId || data.id)">
              删除 passkey
            </button>
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</nz-card>
